{{ define "main" }}
<div id="main-content" class="blog flex-grow-1">
  <div class="container section">
    <div class="row">
      <div class="col-12">
        <h1 class="rad-fade-down rad-waiting rad-animate">{{ .Title }}</h1>
        <p class="blog-description">{{ .Description }}</p>

        <!-- Category navigation -->
        <div class="category-nav">
          <div class="category-filters">
            <a href="/blog/" class="category-btn all-posts">
              <span class="category-icon">📚</span>
              <span class="category-text">All Posts</span>
            </a>
            <a href="/categories/tech/" class="category-btn tech">
              <span class="category-icon">💻</span>
              <span class="category-text">Tech</span>
            </a>
            <a href="/categories/work/" class="category-btn work">
              <span class="category-icon">💼</span>
              <span class="category-text">Work</span>
            </a>
            <a href="/categories/life/" class="category-btn life">
              <span class="category-icon">🌱</span>
              <span class="category-text">Life</span>
            </a>
          </div>
        </div>

        <style>
        .blog-description {
          font-size: 1.1rem;
          color: #6c757d;
          margin-bottom: 2rem;
          line-height: 1.6;
        }

        .category-nav {
          margin: 3rem 0;
        }

        .category-filters {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 1rem;
        }

        .category-btn {
          display: inline-flex;
          align-items: center;
          padding: 0.75rem 1.5rem;
          background: #f8f9fa;
          border: 2px solid #5f9c9c;
          border-radius: 50px;
          text-decoration: none;
          color: #495057;
          font-weight: 500;
          transition: all 0.3s ease;
          box-shadow: 0 2px 8px rgba(95, 156, 156, 0.1);
        }

        .category-btn:hover {
          background: #5f9c9c;
          color: white;
          transform: translateY(-2px);
          box-shadow: 0 6px 20px rgba(95, 156, 156, 0.25);
          text-decoration: none;
        }

        .category-icon {
          font-size: 1.2rem;
          margin-right: 0.5rem;
        }

        .category-text {
          font-size: 0.95rem;
          letter-spacing: 0.025em;
        }

        /* Blog posts grid */
        .posts-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
          gap: 1.5rem;
          margin-top: 2rem;
        }

        .blog-card {
          background: #fff !important;
          border-radius: 12px;
          border-left: 4px solid #5f9c9c;
          padding: 1.5rem;
          transition: all 0.3s ease;
          box-shadow: 0 2px 8px rgba(0,0,0,0.08);
          display: flex;
          flex-direction: column;
        }

        .blog-card:hover {
          transform: translateY(-4px);
          box-shadow: 0 8px 24px rgba(95, 156, 156, 0.2);
          border-left-color: #4a7c7c;
        }

        .blog-card-header {
          margin-bottom: 1rem;
        }

        .blog-card-title {
          font-size: 1.4rem;
          font-weight: 600;
          margin-bottom: 0.75rem;
          line-height: 1.3;
        }

        .blog-card-title a {
          color: #2c3e50 !important;
          text-decoration: none;
          transition: color 0.3s ease;
        }

        .blog-card-title a:hover {
          color: #5f9c9c;
        }

        .blog-meta {
          display: flex;
          flex-wrap: wrap;
          gap: 1rem;
          font-size: 0.875rem;
          color: #6c757d;
          margin-bottom: 1rem;
        }

        .blog-date, .blog-wordcount {
          display: flex;
          align-items: center;
          gap: 0.3rem;
        }

        .blog-date::before {
          content: "📅";
        }

        .blog-wordcount::before {
          content: "📝";
        }

        .blog-tags {
          display: flex;
          flex-wrap: wrap;
          gap: 0.5rem;
          margin-bottom: 1rem;
        }

        .blog-tag {
          display: inline-block;
          padding: 0.25rem 0.75rem;
          background: #4f7c7c;
          border-radius: 20px;
          font-size: 0.8rem;
          color: #ffffff;
          text-decoration: none;
          transition: all 0.3s ease;
        }

        .blog-tag:hover {
          background: #3c5f5f;
          color: #ffffff;
          text-decoration: none;
        }

        .blog-summary {
          flex-grow: 1;
          color: #2c3e50 !important;
          line-height: 1.6;
          margin-bottom: 1.5rem;
          overflow: hidden;
          text-overflow: ellipsis;
          max-height: 4.8em;
        }

        .blog-summary * {
          color: #2c3e50 !important;
        }

        .blog-card-footer {
          margin-top: auto;
        }

        .blog-read-more {
          display: inline-flex;
          align-items: center;
          padding: 0.6rem 1.25rem;
          background: #5f9c9c;
          color: white;
          border-radius: 8px;
          text-decoration: none;
          font-weight: 500;
          transition: all 0.3s ease;
        }

        .blog-read-more:hover {
          background: #4a7c7c;
          transform: translateY(-2px);
          box-shadow: 0 4px 12px rgba(95, 156, 156, 0.3);
          color: white;
          text-decoration: none;
        }

        .blog-read-more::after {
          content: " →";
          margin-left: 0.5rem;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
          .posts-grid {
            grid-template-columns: 1fr;
            gap: 1.5rem;
          }

          .category-filters {
            flex-direction: column;
            align-items: stretch;
          }

          .category-btn {
            justify-content: center;
          }

          .blog-card {
            padding: 1.25rem;
          }

          .blog-card-title {
            font-size: 1.2rem;
          }
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
          .blog-card {
            background: #2d3748;
            border-left-color: #5f9c9c;
          }

          .blog-card-title a {
            color: #e2e8f0;
          }

          .blog-card-title a:hover {
            color: #5f9c9c;
          }

          .blog-meta {
            color: #a0aec0;
          }

          .blog-summary {
            color: #cbd5e0;
          }

          .blog-tag {
            background: #4f7c7c;
            color: #ffffff;
          }

          .blog-tag:hover {
            background: #3c5f5f;
            color: #ffffff;
          }

          .blog-description {
            color: #a0aec0;
          }
        }
        </style>

        <!-- Posts display -->
        <div class="posts-grid">
          {{ range .Pages }}
            {{ partial "blog/card.html" . }}
          {{ end }}
        </div>
      </div>
    </div>
  </div>
</div>
{{ end }}
